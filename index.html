<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3a100e" />
    <title>Olundar</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/olundar-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/play/play.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <strong>Olundar</strong>
          <small>Hold the living world</small>
        </div>
      </div>
      <div id="resources" class="resources" aria-live="polite"></div>
      <div class="bar-actions">
        <strong id="turnLabel">Turn 1</strong>
        <button id="nextUnit" type="button">Next unit</button>
        <button id="endTurn" class="primary" type="button">End turn</button>
        <button id="installTop" type="button" hidden>Install</button>
        <button id="audioTop" type="button">Audio</button>
        <button id="saveTop" type="button">Save</button>
        <button id="loadTop" type="button">Load</button>
        <button id="newTop" type="button">New</button>
      </div>
    </header>
    <main class="stage">
      <div class="map-frame">
        <canvas id="board" aria-label="Olundar campaign map"></canvas>
      </div>
      <aside id="dock" class="dock" aria-live="polite"></aside>
    </main>
    <div id="modal" class="modal" hidden></div>
    <script type="module" src="./src/play/main.js"></script>
  </body>
</html>
